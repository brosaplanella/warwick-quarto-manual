# Module colour palette: the one place where colours are defined.
#
# Give each colour at 100%. Tints (80, 60, 40, 20%) are made by mixing with white,
# which matches the Warwick brand guide to within rounding. scripts/palette.py turns this
# file into _shared/generated/ (LaTeX colours and the HTML themes); it runs before every
# render, so just edit this file.
#
# Use a colour by name with a "brand-" prefix (LaTeX already has colours called blue, green...):
#   LaTeX: \color{brand-coral}, \color{brand-coral-60}
#   CSS:   var(--brand-coral), var(--brand-coral-60)
#
# Text needs a contrast of at least 4.5 (WCAG AA). On white only purple is dark enough for
# text; the others are for fills, boxes and highlights. In dark mode it is the other way round.

colours:
  purple:
    hex: "#440379"    # contrast on white 13.7, on dark 1.2
  lavender:
    hex: "#A499F4"    # contrast on white 2.5, on dark 6.4
  coral:
    hex: "#F1977F"    # contrast on white 2.2, on dark 7.2
  blue:
    hex: "#6CB7FF"    # contrast on white 2.1, on dark 7.5
  green:
    hex: "#51D7C1"    # contrast on white 1.8, on dark 9.0
  yellow:
    hex: "#FEDE7B"    # contrast on white 1.3, on dark 12.1
  black:
    hex: "#0C0C0C"    # brand black; body text keeps the default black (decided 2026-11-04)

# What the template uses colours for: a colour name from the list above, or a hex value.
roles:
  accent: purple          # headings, titles, marks, box frames, links (PDF and light HTML)
  accent-dark: lavender   # the same in dark-mode HTML (purple is unreadable there)
  alert: "#B00020"        # red "staff copy" banners (not a brand colour)
  alert-dark: "#FF6B81"   # the same in dark-mode HTML
